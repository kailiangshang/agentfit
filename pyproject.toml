[project]
name = "agentfit"
version = "0.1.0"
description = "Agent 方案训练系统：输入业务场景和样本，输出经过多轮训练、通过率验证、边界明确的可部署 Agent 方案"
readme = "docs/README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "AgentFit" }]
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentfit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
