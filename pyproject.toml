[project]
name = "agentfit"
version = "0.1.0"
description = "AgentFit: A Virtual Forward-Deployed Agent Engineering Team"
requires-python = ">=3.11"

[project.scripts]
agentfit-run = "agentfit.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]
